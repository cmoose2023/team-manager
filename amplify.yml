version: 1
frontend:
  phases:
    preBuild:
      commands:
        # .nvmrc pins Node 22; Amplify build images include nvm
        - nvm install
        - nvm use
        - node -v
        - npm ci
    build:
      commands:
        # Deploy Amplify Gen 2 backend (Cognito user pool + DynamoDB table)
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
        # Build the Next.js app (output: standalone — see next.config.ts)
        - npm run build
        # Standalone output doesn't include static/public by default; copy them in
        - cp -r .next/static .next/standalone/.next/static
        - cp -r public .next/standalone/public
  artifacts:
    # Amplify Hosting Compute platform serves the standalone bundle
    baseDirectory: .next/standalone
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
